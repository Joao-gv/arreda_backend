spring.application.name=backend

# Conexao com o Banco
spring.datasource.url=jdbc:postgresql://localhost:5432/arredadb
spring.datasource.username=arreda_user
spring.datasource.password=ifmg_arreda_app
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

api.security.token.secret=token-super-seguro-arreda-app

# Envio de e-mails (credenciais fornecidas pelo ambiente; consulte README.md)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
arreda.email.from=${MAIL_FROM:noreply@arreda.local}
